[project]
name = "blender-mcp"
version = "1.8.7"
description = "Blender integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.9.0,<2",
]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["src/blender_mcp/bundled"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RUF",    # Ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
packages = [{ include = "blender_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.5"
pytest = ">=8.0"
blender-python-stubs = "^5.2.1.1"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon/**/*.py"]

[project.urls]
"Homepage" = "https://github.com/ahujasid/blender-mcp"
"Bug Tracker" = "https://github.com/ahujasid/blender-mcp/issues"
